# Temporary (#13): find the macOS test host crash. Removed before the PR is merged.
name: macOS diag
on:
  push:
    branches: [fix/13-macos]
env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        mode: [suite1, suite2, dumps]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: tools/ci/fetch-test-fonts.sh
      - run: dotnet build drawingForCore.slnx -c Release -nodeReuse:false
      - run: dotnet tool install --tool-path "$RUNNER_TEMP/tools" dotnet-dump
      - name: Run
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set +e
          P=test/drawingForCore.System.Drawing.Common.Tests/drawingForCore.System.Drawing.Common.Tests.csproj
          SEL="category!=failing&category!=nonlinuxtests&category!=nonunixtests&category!=nonnetcoreapptests&category!=OuterLoop&category!=IgnoreForCI"
          D="$RUNNER_TEMP/diag"; mkdir -p "$D"
          summ() { grep -E "Passed!|Failed!|aborted|Total tests|Unhandled exception" "$1" | head -4; grep -A6 "test running when the crash" "$1" | head -8; }
          dumps() {
            for d in $(find "$D/$1" -name "*.dmp"); do
              echo "=== $d"
              lldb --batch -c "$d" -o "thread backtrace all -c 30" > "$d.lldb.txt" 2>&1
              "$RUNNER_TEMP/tools/dotnet-dump" analyze "$d" -c "pe -nested" -c "clrstack -all" -c "exit" > "$d.clr.txt" 2>&1
              awk '/OS Thread Id/{t=$0} /SkiaSharp\.SkiaApi|SkiaGdiPlus\.Gdip/{print t": "$0}' "$d.clr.txt" | cut -c1-220 | head -20
              grep -B3 -A30 "CoreText\|FontParser" "$d.lldb.txt" | head -50
              rm -f "$d"
            done
          }
          case $MODE in
            suite*)
              tools/ci/run-tests.sh "$D/r" > "$D/suite.txt" 2>&1; echo "exit $?"
              grep -E "Passed!|Failed!|aborted|crash occurred" -A3 "$D/suite.txt" | head -20
              sed -n '/check_failures\|^Unexpected\|^New\|now pass\|not in the known/,+40p' "$D/suite.txt" | head -150
              cat "$D/r/summary.md" ;;
            dumps)
              for i in 1 2 3 4; do echo "=== run $i"; dotnet test $P -c Release --no-build --blame-crash --blame-crash-dump-type full --results-directory "$D/f$i" --filter "$SEL" > "$D/f$i.txt" 2>&1; summ "$D/f$i.txt"; dumps f$i; done ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/diag/**/*.txt
            ${{ runner.temp }}/diag/**/*.trx
            ${{ runner.temp }}/diag/**/*.md
