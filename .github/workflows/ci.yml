# Linux and Windows builds in parallel, System.Drawing.Common's test suite on both (docs/TESTING.md), and the NuGet
# packages: every run packs them, checks that an application builds and runs from them, and keeps Linux's as the
# "packages" artifact. Linux also checks that the committed source is what the lift scripts produce. A version tag
# (v0.1.0, matching <Version> in Directory.Build.props) also publishes the packages as a GitHub release, once both
# platforms pass, and updates the NuGet feed on GitHub Pages (feed.yml).
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      # The release version from Directory.Build.props; any other run builds a prerelease of it (0.1.0-ci.123).
      - name: Version
        id: version
        run: |
          base=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ "${GITHUB_REF#refs/tags/v}" != "$base" ]]; then
              echo "::error::Tag ${GITHUB_REF#refs/tags/} doesn't match <Version>$base</Version> in Directory.Build.props"; exit 1
            fi
            version=$base
          else
            version=$base-ci.$GITHUB_RUN_NUMBER
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Set up .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-rc.3.26522.148

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fontconfig fonts-dejavu-core libfontconfig1

      # The lifted projects are generated: regenerate them, and docs/lifted-changes.md, from upstream at the lifted
      # commits and fail on any difference, so every change is in the lift scripts or tools/lift/additions/.
      - name: Lift check
        run: |
          tools/lift/fetch-sources.sh "$RUNNER_TEMP/sources"
          tools/lift/lift.sh "$RUNNER_TEMP/sources"
          python3 tools/lift/changes_report.py "$RUNNER_TEMP/sources"
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff --stat
            echo "::error::The committed files differ from what tools/lift/lift.sh and changes_report.py produce; rerun them and commit the result."
            exit 1
          fi

      # Before the build, which copies them next to the tests (the lift check copied them too).
      - name: Test fonts
        run: tools/ci/fetch-test-fonts.sh

      - name: Build
        run: dotnet build drawingForCore.slnx -c Release -nodeReuse:false -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: tools/ci/run-tests.sh "$RUNNER_TEMP/TestResults"

      - name: Test summary
        if: always()
        run: cat "$RUNNER_TEMP/TestResults/summary.md" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/TestResults/*.trx
          if-no-files-found: warn

      - name: Pack
        run: tools/ci/pack.sh ${{ steps.version.outputs.version }} "$RUNNER_TEMP/packages"

      # An application that references the drawingForCore package (not the projects) builds and draws.
      - name: Package smoke test
        run: tools/ci/package-smoke.sh "$RUNNER_TEMP/packages" ${{ steps.version.outputs.version }}

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            ${{ runner.temp }}/packages/*.nupkg
            ${{ runner.temp }}/packages/*.snupkg
          if-no-files-found: error

  # The same build, tests, packing and package smoke test on Windows.
  build-windows:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      # Check files out as they are stored, as on Linux: core.autocrlf would give the shell scripts CRLF line endings.
      - name: Line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      # The scripts call python3; Windows has python.
      - name: python3
        run: |
          mkdir -p "$HOME/bin"
          printf '#!/bin/sh\nexec python "$@"\n' > "$HOME/bin/python3"
          chmod +x "$HOME/bin/python3"
          cygpath -w "$HOME/bin" >> "$GITHUB_PATH"

      - name: Set up .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-rc.3.26522.148

      - name: Test fonts
        run: tools/ci/fetch-test-fonts.sh

      - name: Build
        run: dotnet build drawingForCore.slnx -c Release -nodeReuse:false -p:Version=0.0.0-windows.${{ github.run_number }}

      - name: Test
        run: tools/ci/run-tests.sh "$RUNNER_TEMP/TestResults"

      - name: Test summary
        if: always()
        run: cat "$RUNNER_TEMP/TestResults/summary.md" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: ${{ runner.temp }}/TestResults/*.trx
          if-no-files-found: warn

      - name: Pack
        run: tools/ci/pack.sh 0.0.0-windows.${{ github.run_number }} "$RUNNER_TEMP/packages"

      - name: Package smoke test
        run: tools/ci/package-smoke.sh "$RUNNER_TEMP/packages" 0.0.0-windows.${{ github.run_number }}

  # A version tag: the tested packages become a GitHub release.
  release:
    needs: [build-and-test, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs/release-notes

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-and-test.outputs.version }}
        run: |
          cat > notes.md <<NOTES
          drawingForCore $VERSION as NuGet packages, also on the feed https://jabba2324.github.io/drawingForCore/index.json
          (add it as a package source; see README.md). Reference \`drawingForCore\` (System.Drawing, which brings
          \`drawingForCore.Common\`, System.Drawing.Common), or \`drawingForCore.Common\` alone.
          NOTES
          # The version's own notes (docs/release-notes/<version>.md), when there are some.
          if [ -f "docs/release-notes/$VERSION.md" ]; then printf '\n' >> notes.md; cat "docs/release-notes/$VERSION.md" >> notes.md; fi
          gh release create "$GITHUB_REF_NAME" packages/*.nupkg packages/*.snupkg \
            --repo "$GITHUB_REPOSITORY" --title "drawingForCore $VERSION" --notes-file notes.md --verify-tag

  # The NuGet feed on GitHub Pages, rebuilt from the latest releases (a release made with GITHUB_TOKEN doesn't start
  # other workflows, so it is called from here).
  feed:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/feed.yml
